name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # RTX 40xx, driver 590, CUDA 13, SageAttention
          - profile: modern
            torch_index: https://download.pytorch.org/whl/cu130
            extra_pip: sageattention
          # GTX 1050 Ti (Pascal), driver 580, CUDA 12.x. No custom attention.
          - profile: legacy
            torch_index: https://download.pytorch.org/whl/cu126
            extra_pip: ""
    steps:
      - uses: actions/checkout@v4

      # The torch layers are large; free runner disk before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/comfyui-docker" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.profile }}
            ${{ env.IMAGE }}:${{ matrix.profile }}-${{ github.sha }}
          build-args: |
            TORCH_INDEX_URL=${{ matrix.torch_index }}
            EXTRA_PIP_PACKAGES=${{ matrix.extra_pip }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}
